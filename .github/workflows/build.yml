name: Build SkySpy Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build SkySpy Android applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Build Android Controller APK
        working-directory: apps/controller
        run: gradle --no-daemon assembleDebug

      - name: Upload Android Controller APK
        uses: actions/upload-artifact@v4
        with:
          name: skyspy-controller-android-debug-apk
          path: apps/controller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Android Companion APK
        working-directory: apps/companion
        run: gradle --no-daemon assembleDebug

      - name: Upload Android Companion APK
        uses: actions/upload-artifact@v4
        with:
          name: skyspy-companion-android-debug-apk
          path: apps/companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
